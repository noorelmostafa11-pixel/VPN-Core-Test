syntax = "proto3";

package xray.proxy.shadowsocks;
option csharp_namespace = "Xray.Proxy.Shadowsocks";
option go_package = "github.com/xtls/xray-core/proxy/shadowsocks";
option java_package = "com.xray.proxy.shadowsocks";
option java_multiple_files = true;

import "common/net/network.proto";
import "common/protocol/user.proto";
import "common/protocol/server_spec.proto";

message Account {
  string password = 1;
  CipherType cipher_type = 2;

  bool iv_check = 3;
}

enum CipherType {
  UNKNOWN = 0;
  AES_128_GCM = 5;
  AES_256_GCM = 6;
  CHACHA20_POLY1305 = 7;
  XCHACHA20_POLY1305 = 8;
  // Custom-fork addition. Existing upstream enum numbers are unchanged.
  AES_192_GCM = 9;
  AES_128_CFB = 10;
  AES_192_CFB = 11;
  AES_256_CFB = 12;
  AES_128_CTR = 13;
  AES_192_CTR = 14;
  AES_256_CTR = 15;
  AES_128_OFB = 16;
  AES_192_OFB = 17;
  AES_256_OFB = 18;
  BLOWFISH_CFB = 19;
  CAST5_CFB = 20;
  DES_CFB = 21;
  RC4 = 22;
  RC4_MD5 = 23;
  SALSA20 = 24;
  CHACHA20 = 25;
  CHACHA20_IETF = 26;
  TABLE = 27;
  NONE = 28;
  CAMELLIA_128_CFB = 29;
  CAMELLIA_192_CFB = 30;
  CAMELLIA_256_CFB = 31;
  IDEA_CFB = 32;
  RC2_CFB = 33;
  SEED_CFB = 34;
}

message ServerConfig {
  repeated xray.common.protocol.User users = 1;
  repeated xray.common.net.Network network = 2;
}

message ClientConfig {
  xray.common.protocol.ServerEndpoint server = 1;
}
