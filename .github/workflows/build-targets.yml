name: Build Selected Core Target
on:
  push:
    branches: [feature/windows-native-tun-stage1]
  workflow_dispatch:
    inputs:
      target:
        description: Core target to build from this source revision
        type: choice
        options: [all, windows, linux, android]
        default: linux
      abi:
        description: Android ABI (all only when you need the combined AAR)
        type: choice
        options: [arm64-v8a, armeabi-v7a, x86_64, x86, all]
        default: arm64-v8a
      verify_android_windows:
        description: Also verify Android compilation on a Windows host
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: core-targets-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
jobs:
  linux:
    if: github.event_name == 'push' || inputs.target == 'all' || inputs.target == 'linux'
    name: Linux amd64 production core
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-go@v5
        with: {go-version: '1.27.1', cache-dependency-path: tls-provider/go.sum}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '17'}
      - run: |
          mkdir -p bin
          (cd tls-provider && go build -mod=vendor -o ../bin/xhttp-peer ../tests/xhttp_peer.go)
          python -m pip install -r tests/requirements.txt
          g++ -std=c++17 -Wall -Wextra -Wpedantic -Werror tests/native_tun_packet_probe.cpp -o bin/native_tun_packet_probe
          ./bin/native_tun_packet_probe
          g++ -std=c++17 -Wall -Wextra -Wpedantic -Werror tests/native_tun_udp_probe.cpp -o bin/native_tun_udp_probe
          ./bin/native_tun_udp_probe
          g++ -std=c++17 -O2 -Wall -Wextra -Wpedantic -Werror tests/native_tun_tcp_probe.cpp -o bin/native_tun_tcp_probe
          ./bin/native_tun_tcp_probe
          g++ -std=c++17 -O2 -Wall -Wextra -Wpedantic -Werror tests/native_tun_tcp_reliable_probe.cpp -o bin/native_tun_tcp_reliable_probe
          ./bin/native_tun_tcp_reliable_probe
          g++ -std=c++17 -O2 -Wall -Wextra -Wpedantic -Werror tests/native_network_rollback_probe.cpp -o bin/native_network_rollback_probe
          ./bin/native_network_rollback_probe
          g++ -std=c++17 -O2 -Wall -Wextra -Wpedantic -Werror -Wno-misleading-indentation -DVPN_CORE_PORTABLE tests/native_tun_udp_protocol_probe.cpp -o bin/native_tun_udp_protocol_probe -ldl -pthread
          ./bin/native_tun_udp_protocol_probe
          python scripts/Build.py --target linux --build-tests --require-clean
          python -m unittest -v test_portable_044.PortableTransportTests test_portable_044.SharedCoreTests
          python -m unittest -v test_udp_sdk.UdpSdkTests test_udp_sdk.NetworkHookTests test_lifecycle_acceptance.LifecycleAcceptanceTests test_dns_acceptance.DnsAcceptanceTests
          python scripts/Test-Sdk-Bindings.py --build build/linux-amd64 --java-only
          python scripts/Package-Target.py --build build/linux-amd64
        env:
          PYTHONPATH: tests
          VPN_CORE_TEST_BINARY: ${{ github.workspace }}/build/linux-amd64/vpn-core
      - uses: actions/upload-artifact@v4
        with:
          name: core-linux-amd64-${{ github.sha }}
          path: dist/
          retention-days: 1
          if-no-files-found: error
  windows:
    if: github.event_name == 'push' || inputs.target == 'all' || inputs.target == 'windows'
    name: Windows amd64 shared core API
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-go@v5
        with: {go-version: '1.27.1', cache-dependency-path: tls-provider/go.sum}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - uses: msys2/setup-msys2@v2
        id: msys
        with: {msystem: MINGW64, update: true, install: mingw-w64-x86_64-gcc, path-type: inherit}
      - uses: actions/setup-dotnet@v4
        with: {dotnet-version: '8.0.425'}
      - shell: pwsh
        env:
          MSYS_LOCATION: ${{ steps.msys.outputs.msys2-location }}
          PYTHONPATH: tests
          VPN_CORE_TEST_BINARY: ${{ github.workspace }}/build/windows-amd64/vpn-core.exe
        run: |
          $env:PATH=(Join-Path $env:MSYS_LOCATION 'mingw64\bin')+';'+$env:PATH
          New-Item -ItemType Directory -Force bin | Out-Null
          Push-Location tls-provider
          go build -mod=vendor -o ../bin/xhttp-peer.exe ../tests/xhttp_peer.go
          Pop-Location
          if ($LASTEXITCODE) { throw 'Independent peer build failed' }
          g++ -std=c++17 -Wall -Wextra -Wpedantic -Werror tests/native_tun_packet_probe.cpp -o bin/native_tun_packet_probe.exe
          if ($LASTEXITCODE) { throw 'Native TUN packet policy compilation failed' }
          & (Join-Path 'bin' 'native_tun_packet_probe.exe')
          if ($LASTEXITCODE) { throw 'Native TUN packet policy smoke failed' }
          g++ -std=c++17 -Wall -Wextra -Wpedantic -Werror tests/native_tun_udp_probe.cpp -o bin/native_tun_udp_probe.exe
          if ($LASTEXITCODE) { throw 'Native TUN UDP codec compilation failed' }
          & (Join-Path 'bin' 'native_tun_udp_probe.exe')
          if ($LASTEXITCODE) { throw 'Native TUN UDP codec smoke failed' }
          g++ -std=c++17 -O2 -Wall -Wextra -Wpedantic -Werror tests/native_tun_tcp_probe.cpp -o bin/native_tun_tcp_probe.exe
          if ($LASTEXITCODE) { throw 'Native TUN TCP segment probe build failed' }
          & (Join-Path 'bin' 'native_tun_tcp_probe.exe')
          if ($LASTEXITCODE) { throw 'Native TUN TCP segment probe failed' }
          g++ -std=c++17 -O2 -Wall -Wextra -Wpedantic -Werror tests/native_tun_tcp_reliable_probe.cpp -o bin/native_tun_tcp_reliable_probe.exe
          if ($LASTEXITCODE) { throw 'Native TUN reliable TCP probe compilation failed' }
          & (Join-Path 'bin' 'native_tun_tcp_reliable_probe.exe')
          if ($LASTEXITCODE) { throw 'Native TUN reliable TCP probe failed' }
          g++ -std=c++17 -O2 -Wall -Wextra -Wpedantic -Werror tests/native_network_rollback_probe.cpp -o bin/native_network_rollback_probe.exe
          if ($LASTEXITCODE) { throw 'Native network rollback journal compilation failed' }
          & (Join-Path 'bin' 'native_network_rollback_probe.exe')
          if ($LASTEXITCODE) { throw 'Native network rollback journal test failed' }
          g++ -std=c++17 -O2 -Wall -Wextra -Wpedantic -Werror -Wno-misleading-indentation -D_WIN32_WINNT=0x0A00 tests/native_tun_udp_protocol_probe.cpp -o bin/native_tun_udp_protocol_probe.exe -lws2_32 -lsecur32 -lcrypt32 -lbcrypt -pthread
          if ($LASTEXITCODE) { throw 'Native TUN UDP protocol bridge compilation failed' }
          & (Join-Path 'bin' 'native_tun_udp_protocol_probe.exe')
          if ($LASTEXITCODE) { throw 'Native TUN UDP protocol bridge smoke failed' }
          g++ -std=c++17 -Wall -Wextra -Wpedantic -Werror tests/native_wintun_loader_probe.cpp -o bin/native_wintun_loader_probe.exe
          if ($LASTEXITCODE) { throw 'Native Wintun loader compilation failed' }
          & (Join-Path 'bin' 'native_wintun_loader_probe.exe')
          if ($LASTEXITCODE) { throw 'Native Wintun loader smoke failed' }
          g++ -std=c++17 -O2 -Wall -Wextra -Wpedantic -Werror -D_WIN32_WINNT=0x0A00 tests/native_windows_network_snapshot_probe.cpp -o bin/native_windows_network_snapshot_probe.exe -liphlpapi -lws2_32
          if ($LASTEXITCODE) { throw 'Windows native network snapshot compilation failed' }
          & (Join-Path 'bin' 'native_windows_network_snapshot_probe.exe')
          if ($LASTEXITCODE) { throw 'Windows native network snapshot check failed' }
          python scripts/Build.py --target windows --require-clean
          if ($LASTEXITCODE) { throw 'Windows build failed' }
          python -m pip install -r tests/requirements.txt
          python -m unittest -v test_portable_044.SharedCoreTests test_udp_sdk.UdpSdkTests test_lifecycle_acceptance.LifecycleAcceptanceTests test_dns_acceptance.DnsAcceptanceTests
          if ($LASTEXITCODE) { throw 'Shared core regression failed' }
          python scripts/Test-Sdk-Bindings.py --build build/windows-amd64 --dotnet-only
          if ($LASTEXITCODE) { throw 'Windows .NET SDK smoke failed' }
          python scripts/Package-Target.py --build build/windows-amd64
          if ($LASTEXITCODE) { throw 'Target package failed' }
      - uses: actions/upload-artifact@v4
        with:
          name: core-windows-amd64-${{ github.sha }}
          path: dist/
          retention-days: 1
          if-no-files-found: error
  android:
    if: github.event_name != 'push' && (inputs.target == 'all' || inputs.target == 'android')
    name: Android ${{ matrix.abi }} libraries
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        abi: ${{ fromJSON(inputs.abi == 'all' && '["arm64-v8a","armeabi-v7a","x86_64","x86"]' || format('["{0}"]', inputs.abi)) }}
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-go@v5
        with: {go-version: '1.27.1', cache-dependency-path: tls-provider/go.sum}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Install pinned NDK
        run: '"$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;30.0.16248370"'
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '17'}
      - name: Build the selected ABI from source
        run: |
          python scripts/Build.py --target android --abi '${{ matrix.abi }}' --ndk "$ANDROID_HOME/ndk/30.0.16248370" --build-tests --require-clean
          python scripts/Package-Target.py --build 'build/android-${{ matrix.abi }}'
      - uses: actions/upload-artifact@v4
        with:
          name: core-android-${{ matrix.abi }}-${{ github.sha }}
          path: |
            build/android-${{ matrix.abi }}/
            dist/
          retention-days: 1
          if-no-files-found: error
  android_windows:
    if: github.event_name != 'push' && inputs.verify_android_windows && (inputs.target == 'all' || inputs.target == 'android')
    name: Android arm64 built on a Windows laptop environment
    runs-on: windows-2022
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-go@v5
        with: {go-version: '1.27.1', cache-dependency-path: tls-provider/go.sum}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '17'}
      - shell: pwsh
        run: |
          & "$env:ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager.bat" 'ndk;30.0.16248370'
          if ($LASTEXITCODE) { throw 'NDK setup failed' }
          python scripts/Build.py --target android --abi arm64-v8a --ndk "$env:ANDROID_HOME/ndk/30.0.16248370"
          if ($LASTEXITCODE) { throw 'Android build on Windows failed' }
      - uses: actions/upload-artifact@v4
        with:
          name: core-android-from-windows-${{ github.sha }}
          path: build/android-arm64-v8a/
          retention-days: 1
          if-no-files-found: error
  android_package:
    needs: android
    if: github.event_name != 'push' && (inputs.target == 'all' || inputs.target == 'android')
    name: Android SDK AAR with all four ABIs
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '17'}
      - uses: actions/download-artifact@v4
        with:
          pattern: core-android-*-${{ github.sha }}
          path: android-inputs
      - name: Package verified native ABIs into one SDK
        run: |
          python - <<'PYCODE'
          import pathlib,subprocess
          roots=sorted(pathlib.Path('android-inputs').glob('core-android-*/build/android-*'))
          roots=[p for p in roots if 'from-windows' not in str(p)]
          if not roots:raise SystemExit('No Android inputs')
          subprocess.run(['python','scripts/Package-Android.py',*[item for p in roots for item in ['--build',str(p)]],'--output','dist/vpn-core-android.aar'],check=True)
          PYCODE
          sha256sum dist/vpn-core-android.aar > dist/vpn-core-android.aar.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: core-android-sdk-${{ github.sha }}
          path: dist/vpn-core-android.aar*
          retention-days: 1
          if-no-files-found: error
