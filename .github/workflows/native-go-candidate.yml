name: Native TUN Go-only candidate proof
on:
  push:
    branches: [feature/native-tun-go-core]
    paths:
      - 'tls-provider/nativego/**'
      - 'tls-provider/cmd/nativego-linux/**'
      - '.github/workflows/native-go-candidate.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  proof:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.1'
          cache-dependency-path: tls-provider/go.sum
      - name: Native Go packet engine and protocol tests
        working-directory: tls-provider
        run: go test -race -count=1 -v -tags=netstack -mod=vendor ./nativego
      - name: Native Go vet
        working-directory: tls-provider
        run: go vet -tags=netstack -mod=vendor ./nativego
      - name: Real Linux TUN packet DNS in isolated network namespace
        working-directory: tls-provider
        run: |
          set -euo pipefail
          test -c /dev/net/tun
          command -v ip
          CGO_ENABLED=0 go test -c -tags=netstack -mod=vendor -o /tmp/nativego-tun-test ./nativego
          NS="nativego-$GITHUB_RUN_ID"
          sudo ip netns add "$NS"
          trap 'sudo ip netns delete "$NS" || true' EXIT
          sudo ip netns exec "$NS" ip link set lo up
          sudo ip netns exec "$NS" env VPN_NATIVE_GO_PRIVILEGED_TEST=1 /tmp/nativego-tun-test -test.v -test.run TestNativeGoLinuxRealTUN
      - name: Ensure Go-only package can build without CGO
        working-directory: tls-provider
        run: CGO_ENABLED=0 go build -tags=netstack -mod=vendor ./nativego
      - name: Compile the standalone Go-native Linux TUN host
        working-directory: tls-provider
        run: CGO_ENABLED=0 go build -tags=netstack -mod=vendor ./cmd/nativego-linux
      - name: Cross-compile Windows and Android Go core without CGO
        working-directory: tls-provider
        run: |
          GOOS=windows GOARCH=amd64 CGO_ENABLED=0 go build -tags=netstack -mod=vendor ./nativego
          GOOS=android GOARCH=arm64 CGO_ENABLED=0 go build -tags=netstack -mod=vendor ./nativego
  windows-proof:
    runs-on: windows-2022
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.1'
          cache-dependency-path: tls-provider/go.sum
      - name: Go-only Windows candidate unit tests
        working-directory: tls-provider
        run: go test -count=1 -tags=netstack -mod=vendor ./nativego
