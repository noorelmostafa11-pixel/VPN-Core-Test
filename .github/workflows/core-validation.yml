# Same registered path as main, so Run workflow can select this branch without
# changing main. Only manual dispatch is enabled in the custom branch.
name: Build & Test
run-name: Xray compatibility - ${{ github.ref_name }}

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: xray-compatibility-${{ github.ref }}
  cancel-in-progress: false

jobs:
  compatibility:
    name: Compatibility (${{ matrix.system }})
    timeout-minutes: 65
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2025
            system: Windows
          - os: ubuntu-24.04
            system: Linux
          - os: macos-15
            system: macOS
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: fork-source
    env:
      GOTOOLCHAIN: local
    steps:
      - name: Check out the selected fork revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          path: fork-source
          persist-credentials: false
      - name: Set up the test toolchain
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.27.1'
          cache: false
      - name: Check test prerequisites and pinned data
        id: prepare
        run: go run ./fork/check prepare
      - name: Check out pinned main for compatibility comparisons
        id: reference
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ steps.prepare.outputs.main_commit }}
          path: comparison-main
          persist-credentials: false
      - name: All core tests with race detection
        if: ${{ !cancelled() && steps.prepare.outcome == 'success' }}
        run: go run ./fork/check suite
      - name: Static checks for the entire core
        if: ${{ !cancelled() && steps.prepare.outcome == 'success' }}
        run: go run ./fork/check vet
      - name: Fork and main TCP-UDP compatibility in both roles
        if: ${{ !cancelled() && steps.prepare.outcome == 'success' && steps.reference.outcome == 'success' }}
        run: go run ./fork/check wire
      - name: Compatibility results and known gaps
        if: ${{ always() }}
        run: go run ./fork/check summary
      - name: Keep test reports only (no program packages)
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: compatibility-report-${{ matrix.system }}
          path: ${{ runner.temp }}/xray-compatibility/
          if-no-files-found: warn
          retention-days: 7
