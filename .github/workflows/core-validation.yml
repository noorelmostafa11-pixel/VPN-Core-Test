# Manual-only Xray fork validation; default branch stays unchanged.
name: Build & Test
run-name: Xray self-validation - ${{ github.ref_name }}

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: xray-self-validation-${{ github.ref }}
  cancel-in-progress: false

jobs:
  self-validation:
    name: Xray self-check (${{ matrix.system }})
    timeout-minutes: 65
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2025
            system: Windows
          - os: ubuntu-24.04
            system: Linux
          - os: macos-15
            system: macOS
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: fork-source
    env:
      GOTOOLCHAIN: local
    steps:
      - name: Check out only the selected Xray fork revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          path: fork-source
          persist-credentials: false
      - name: Set up the test toolchain
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.27.1'
          cache: false
      - name: Check test prerequisites and pinned data
        id: prepare
        run: go run ./fork/check prepare
      - name: All fork tests with race detection
        if: ${{ !cancelled() && steps.prepare.outcome == 'success' }}
        run: go run ./fork/check suite
      - name: Static checks for the entire fork
        if: ${{ !cancelled() && steps.prepare.outcome == 'success' }}
        run: go run ./fork/check vet
      - name: Build Xray fork executable
        id: build
        if: ${{ !cancelled() && steps.prepare.outcome == 'success' }}
        run: go run ./fork/check build
      - name: Xray client-server TCP-UDP self-compatibility
        if: ${{ !cancelled() && steps.prepare.outcome == 'success' && steps.build.outcome == 'success' }}
        run: go run ./fork/check wire
      - name: Self-validation results and known gaps
        if: ${{ always() }}
        run: go run ./fork/check summary
      - name: Keep test reports only (no program packages)
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: xray-self-validation-${{ matrix.system }}
          path: ${{ runner.temp }}/xray-compatibility/
          if-no-files-found: warn
          retention-days: 7
