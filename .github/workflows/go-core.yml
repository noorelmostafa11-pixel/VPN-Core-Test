name: Go Core Validation
on:
  push:
    branches: [feature/go-native-core]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: go-core-${{ github.ref }}
  cancel-in-progress: true
jobs:
  runtime:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: {go-version-file: go.mod, cache: false}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install -r tests/requirements-go.txt
      - run: python scripts/Apply-Go-Component-Patches.py
      - run: go test -race ./core ./mobile
      - run: python scripts/Validate-Go.py
      - run: python scripts/Build-Go.py --shared
      - name: Check C ABI hook lifecycle
        shell: bash
        run: |
          if [ "$RUNNER_OS" = Windows ]; then cp build/windows-amd64/vpn-core.dll bin/vpn-core.dll; export VPN_CORE_TEST_BINARY="$GITHUB_WORKSPACE/bin/vpn-core.exe"; else cp build/*/libvpn-core.* bin/libvpn-core.so; export VPN_CORE_TEST_BINARY="$GITHUB_WORKSPACE/bin/vpn-core"; fi
          cd tests
          python -m unittest test_udp_sdk.NetworkHookTests -v
      - name: Test the real Linux TUN device on an isolated network
        if: runner.os == 'Linux'
        run: |
          go test -c -o bin/native-tests ./core
          sudo env VPN_CORE_TEST_NATIVE_TUN=1 ./bin/native-tests -test.run=TestLinuxNativeDevice -test.v -test.timeout=45s
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: go-${{ runner.os }}-${{ github.run_id }}
          path: build/
          retention-days: 3
  portable:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: {go-version-file: go.mod, cache: false}
      - name: Build portable targets
        run: |
          for target in windows linux darwin android freebsd openbsd; do
            for arch in amd64 arm64; do
              if [ "$target" = android ]; then abi=arm64-v8a; [ "$arch" = amd64 ] && abi=x86_64; python3 scripts/Build-Go.py --target android --abi "$abi"; else python3 scripts/Build-Go.py --target "$target" --arch "$arch"; fi
            done
          done
      - uses: actions/upload-artifact@v4
        with: {name: portable-go-core, path: build/, retention-days: 3}
