name: Test Go Core Against Pre
on:
  workflow_dispatch:
    inputs:
      shards:
        description: 'Number of input shards; 2000 samples about 40 original nodes'
        default: '2000'
      shard:
        default: '0'
permissions: {contents: read}
jobs:
  network:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: {go-version-file: go.mod, cache: false}
      - run: python3 scripts/Build-Go.py --target linux --arch amd64
      - run: python3 scripts/Prepare-Pre-Snapshot.py --latest --destination pre-run/protocols --manifest-out pre-run/manifest.json
      - run: python3 scripts/Test-Nodes.py --core build/linux-amd64/vpn-core --nodes pre-run/protocols --pre-manifest pre-run/manifest.json --output network-results --source-commit '${{ github.sha }}' --shards '${{ inputs.shards }}' --shard '${{ inputs.shard }}' --timeout 10 --concurrency 8
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: go-network-results, path: network-results/, retention-days: 14}
